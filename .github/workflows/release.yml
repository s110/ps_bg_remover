# Release automático: ejecutables autocontenidos para Windows y macOS.
#
# Se dispara al pushear un tag v* (o a mano desde Actions → Run workflow).
# Estos builds usan PyTorch CPU/MPS para caber en el límite de 2 GB por
# asset de GitHub Releases. El build con CUDA para la RTX 5070 Ti pesa
# varios GB: se genera localmente con packaging/build_release.bat.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Kamiru-win64-cpu
            zip_cmd: powershell -NoLogo -Command "Compress-Archive -Force -Path dist/Kamiru -DestinationPath Kamiru-win64-cpu.zip"
          - os: macos-latest
            artifact: Kamiru-macos
            zip_cmd: ditto -c -k --keepParent dist/Kamiru Kamiru-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          uv venv build-env --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=build-env/Scripts/python.exe
            uv pip install --python $PY torch torchvision --index-url https://download.pytorch.org/whl/cpu
          else
            PY=build-env/bin/python
            uv pip install --python $PY torch torchvision
          fi
          uv pip install --python $PY -e . pyinstaller

      - name: Build executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=build-env/Scripts/python.exe; else PY=build-env/bin/python; fi
          $PY -m PyInstaller packaging/kamiru.spec --noconfirm --distpath dist --workpath build

      - name: Zip
        run: ${{ matrix.zip_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "*.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
